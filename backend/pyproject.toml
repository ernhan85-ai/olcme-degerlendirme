[project]
name = "bcn-learndna-assessment"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "SQLAlchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "python-multipart>=0.0.9",
  "PyJWT>=2.9",
  "sympy>=1.13",
  "httpx>=0.27",
  "celery>=5.4",
  "redis>=5.0",
]

[project.optional-dependencies]
pdf = ["pypdfium2>=4.30", "pillow>=10.4"]
dev = ["pytest>=8.3", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 140
[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["B008", "E501"]
